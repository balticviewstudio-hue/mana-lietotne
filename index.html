<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Latviešu čats</title>
<style>
  :root { --bg:#eaf0ee; --bot:#ffffff; --me:#1f4d45; --ink:#1c2b28; --muted:#5f7570; --line:#cfdcd8; --amber:#b9791f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 22px; border-bottom: 1px solid var(--line); background: #f6f9f8; }
  h1 { margin: 0; font-size: 19px; font-weight: 600; }
  #stats { font-size: 13px; color: var(--muted); margin-left: 12px; }
  #reset { background: none; border: 1px solid var(--line); color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #reset:hover { color: var(--ink); border-color: var(--muted); }
  #log { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 72%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
  .bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .me { align-self: flex-end; background: var(--me); color: #fff; border-bottom-right-radius: 4px; }
  .bot.ask { border-left: 3px solid var(--amber); }
  form { display: flex; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--line); background: #f6f9f8; }
  input { flex: 1; padding: 11px 14px; font-size: 15px; font-family: inherit; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--me); outline-offset: 1px; }
  #send { background: var(--me); color: #fff; border: 0; padding: 0 22px; border-radius: 8px; font-size: 15px; cursor: pointer; }
  #send:hover { background: #17403a; }
</style>
</head>
<body>
<header>
  <div><h1 style="display:inline">Latviešu čats</h1><span id="stats"></span></div>
  <button id="reset" type="button">Aizmirst visu</button>
</header>
<div id="log"></div>
<form id="f" autocomplete="off">
  <input id="inp" placeholder="Raksti latviski..." autofocus>
  <button id="send" type="submit">Sūtīt</button>
</form>

<script>
  var KEY = 'lv-chat-v1';

  function load() {
    try { var m = JSON.parse(localStorage.getItem(KEY)); if (m && m.pairs) return m; } catch (e) {}
    return { name: '', pairs: [], log: [], pending: null };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} }
  var mem = load();

  // ---------- Valodas palīgfunkcijas ----------
  function norm(s) {
    return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, ' ').trim();
  }
  var ENDINGS = ['iem', 'ajam', 'ams', 'ies', 'am', 'as', 'ai', 'is', 'us', 'os', 'es', 'ot', 'ta', 'ts', 'u', 'a', 'e', 'i', 's', 't'];
  function stem(w) {
    if (w.length < 5) return w;
    for (var i = 0; i < ENDINGS.length; i++) {
      var e = ENDINGS[i];
      if (w.length - e.length >= 3 && w.slice(-e.length) === e) return w.slice(0, -e.length);
    }
    return w;
  }
  function tokens(s) { var n = norm(s); return n ? n.split(' ').map(stem) : []; }
  function jaccard(a, b) {
    var A = {}, B = {}, inter = 0, uni = 0, k;
    a.forEach(function (x) { A[x] = 1; }); b.forEach(function (x) { B[x] = 1; });
    for (k in A) { uni++; if (B[k]) inter++; }
    for (k in B) { if (!A[k]) uni++; }
    return uni ? inter / uni : 0;
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function vards() { return mem.name ? ', ' + mem.name : ''; }

  // ---------- Iebūvētās zināšanas (atslēgvārdi bez garumzīmēm) ----------
  var base = [
    { k: ['sveiki', 'sveika', 'cau', 'labdien', 'labrit', 'labvakar', 'sveiciens', 'hei'],
      a: [function () { return 'Sveiki' + vards() + '! Kā es varu palīdzēt?'; },
          function () { return 'Labdien' + vards() + '! Priecājos tevi redzēt.'; },
          function () { return 'Čau' + vards() + '! Kā tev iet?'; }] },
    { k: ['ka tev iet', 'ka tev klajas', 'ka jutos', 'ka iet'],
      a: ['Man iet labi, paldies! Bet tev?', 'Paldies, labi! Ko tu šodien dari?'] },
    { k: ['ka tevi sauc', 'kas tu esi', 'tavs vards'],
      a: ['Es esmu latviešu čata palīgs. Es mācos no mūsu sarunām.'] },
    { k: ['paldies', 'liels paldies'], a: ['Lūdzu!', 'Nav par ko!'] },
    { k: ['uz redzesanos', 'ata', 'visu labu', 'ardievas'],
      a: [function () { return 'Uz redzēšanos' + vards() + '! Visu labu!'; }] },
    { k: ['cik pulkstens', 'cik ir pulkstens'],
      a: [function () { return 'Pulkstenis ir ' + new Date().toLocaleTimeString('lv-LV', { hour: '2-digit', minute: '2-digit' }) + '.'; }] },
    { k: ['kads sodien datums', 'kads ir datums', 'kura diena sodien', 'kada diena sodien'],
      a: [function () { return 'Šodien ir ' + new Date().toLocaleDateString('lv-LV', { dateStyle: 'full' }) + '.'; }] },
    { k: ['ko tu zini', 'ko tu esi iemacijies', 'ko tu atceries'],
      a: [function () {
        return 'Esmu iemācījies ' + mem.pairs.length + ' jautājumus ar atbildēm' +
               (mem.name ? ' un atceros, ka tevi sauc ' + mem.name : '') + '.';
      }] },
    { k: ['palidziba', 'ko tu proti', 'ko tu vari'],
      a: ['Es māku sasveicināties, pateikt laiku un datumu, un atcerēties tavu vārdu (uzraksti: mani sauc ...). Ja nezinu atbildi, pajautāšu tev, un nākamreiz atbildēšu pats.'] },
    { k: ['labi', 'okei', 'ok', 'forsi'], a: ['Lieliski!'] }
  ];

  function findBase(n) {
    var padded = ' ' + n + ' ', best = null, bestLen = 0;
    base.forEach(function (e) {
      e.k.forEach(function (k) {
        if (padded.indexOf(' ' + k + ' ') !== -1 && k.length > bestLen) { best = e; bestLen = k.length; }
      });
    });
    return best;
  }

  // ---------- Mācīšanās ----------
  function findTaught(text) {
    var t = tokens(text), best = null, bestScore = 0;
    mem.pairs.forEach(function (p) {
      var s = jaccard(t, tokens(p.q));
      if (s > bestScore) { bestScore = s; best = p; }
    });
    return bestScore >= 0.6 ? best : null;
  }
  function teach(q, a) {
    var nq = norm(q), found = null;
    mem.pairs.forEach(function (p) { if (norm(p.q) === nq) found = p; });
    if (found) { if (found.a.indexOf(a) === -1) found.a.push(a); }
    else mem.pairs.push({ q: q, a: [a] });
  }

  function reply(text) {
    var n = norm(text);

    if (mem.pending) {
      var q = mem.pending; mem.pending = null;
      if (/^(ne|nevajag|neko|aizmirsti)$/.test(n)) return { t: 'Labi, to izlaižam.' };
      teach(q, text.trim());
      return { t: 'Paldies! Tagad es zinu, ko atbildēt uz „' + q + '“.' };
    }

    var m = text.match(/(?:mani sauc|mans v[āa]rds ir)\s+(\p{L}+)/iu);
    if (m) {
      mem.name = m[1].charAt(0).toUpperCase() + m[1].slice(1);
      return { t: 'Priecājos iepazīties, ' + mem.name + '! Es to atcerēšos.' };
    }

    var t = findTaught(text);
    if (t) return { t: pick(t.a) };

    var b = findBase(n);
    if (b) { var a = pick(b.a); return { t: typeof a === 'function' ? a() : a }; }

    mem.pending = text.trim();
    return { t: 'Es vēl nezinu, ko atbildēt uz šo. Ko man vajadzētu atbildēt? Ieraksti atbildi vai „nē“, lai izlaistu.', ask: true };
  }

  // ---------- Saskarne ----------
  var logEl = document.getElementById('log');
  var inp = document.getElementById('inp');

  function stats() {
    document.getElementById('stats').textContent = 'Iemācīts: ' + mem.pairs.length;
  }
  function show(role, text, ask) {
    var d = document.createElement('div');
    d.className = 'msg ' + role + (ask ? ' ask' : '');
    d.textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function add(role, text, ask) {
    show(role, text, ask);
    mem.log.push({ r: role, t: text, a: !!ask });
    if (mem.log.length > 200) mem.log = mem.log.slice(-200);
    save();
  }

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var text = inp.value.trim();
    if (!text) return;
    inp.value = '';
    add('me', text);
    var r = reply(text);
    setTimeout(function () { add('bot', r.t, r.ask); stats(); }, 300);
  });

  document.getElementById('reset').addEventListener('click', function () {
    if (confirm('Vai tiešām aizmirst visu, ko esmu iemācījies?')) {
      try { localStorage.removeItem(KEY); } catch (e) {}
      location.reload();
    }
  });

  mem.log.forEach(function (m) { show(m.r, m.t, m.a); });
  if (!mem.log.length) {
    add('bot', 'Sveiki! Es esmu latviešu čata palīgs un mācos no mūsu sarunām. Ja nezināšu atbildi, pajautāšu tev. Kā tevi sauc?');
  }
  stats();
  inp.focus();
</script>
</body>
</html>
