<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Mana lietotne</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
  header { padding: 20px 28px; background: #1e293b; border-bottom: 1px solid #334155; }
  h1 { margin: 0; font-size: 22px; }
  #clock { margin-top: 4px; color: #94a3b8; font-size: 14px; }
  main { padding: 24px 28px; }
  textarea { width: 100%; height: 340px; padding: 14px; font-size: 15px; font-family: inherit;
             background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; resize: none; }
  textarea:focus { outline: 2px solid #3b82f6; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  button { background: #3b82f6; color: #fff; border: 0; padding: 10px 20px; border-radius: 8px;
           font-size: 15px; cursor: pointer; }
  button:hover { background: #2563eb; }
  #status { color: #94a3b8; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Mana lietotne</h1>
  <div id="clock"></div>
</header>
<main>
  <textarea id="notes" placeholder="Raksti savas piezīmes šeit..."></textarea>
  <div class="row">
    <button id="save">Saglabāt</button>
    <span id="status"></span>
  </div>
</main>
<script>
  const notes = document.getElementById('notes');
  const status = document.getElementById('status');
  const KEY = 'mana-lietotne-piezimes';

  notes.value = localStorage.getItem(KEY) || '';

  function save() {
    localStorage.setItem(KEY, notes.value);
    status.textContent = 'Saglabāts ' + new Date().toLocaleTimeString('lv-LV');
  }
  document.getElementById('save').addEventListener('click', save);
  notes.addEventListener('input', () => { clearTimeout(window._t); window._t = setTimeout(save, 800); });

  function tick() {
    document.getElementById('clock').textContent =
      new Date().toLocaleString('lv-LV', { dateStyle: 'full', timeStyle: 'medium' });
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
